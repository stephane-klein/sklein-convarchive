[tools]
go = "1.26.1"
rclone = "1.75.0"
"github:facebook/zstd" = "1.5.7"

[env]
_.file = ".secret"

PROJECT_NAME = "sklein-convarchive"
INSTANCE_ID = "{{ cwd | hash(algorithm='sha256', len=12) }}"
COMPOSE_PROJECT_NAME = "{{ env.PROJECT_NAME }}_{{ env.INSTANCE_ID }}"

SKLEIN_CONVARCHIVE_OWNER="stephane"

# rclone remote "rustfs" configured from the S3 credentials in .secret
RCLONE_CONFIG_RUSTFS_TYPE = "s3"
RCLONE_CONFIG_RUSTFS_PROVIDER = "Other"
RCLONE_CONFIG_RUSTFS_ENDPOINT = "{{ env.S3_ENDPOINT }}"
RCLONE_CONFIG_RUSTFS_ACCESS_KEY_ID = "{{ env.S3_ACCESS_KEY }}"
RCLONE_CONFIG_RUSTFS_SECRET_ACCESS_KEY = "{{ env.S3_SECRET_KEY }}"
# silence rclone's NOTICE about the missing config file (the remote is env-configured)
RCLONE_LOG_LEVEL = "ERROR"

[tasks.build]
run = "go build -ldflags \"-X main.version=$(git describe --tags --always --dirty | sed 's/^v//')\" -o sklein-convarchive ./cmd"
description = "Build the sklein-convarchive CLI application"

[tasks.test]
run = "go test ./..."
description = "Run all Go unit tests"

[tasks.test-race]
run = "go test -race ./..."
description = "Run all Go unit tests with the race detector (slower, requires cgo)"

[tasks.up]
run = "scripts/up.sh"
description = "Start the local RustFS object storage (dev)"

[tasks.down]
run = "scripts/down.sh"
description = "Stop and remove the local RustFS object storage (dev)"

[tasks.teardown]
run = "scripts/teardown.sh"
description = "Stop everything and destroy the local RustFS data volumes (destructive)"

[tasks.logs]
run = "podman compose logs -f rustfs"
description = "Follow the RustFS container logs"
